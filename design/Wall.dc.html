</style>

<div dir="rtl" style="width: 390px; height: 1100px; box-sizing: border-box; background: #F5F7F2; font-family: Heebo, sans-serif; color: #1E3328; display: flex; flex-direction: column; gap: 14px; padding: 16px">

      </article>

        <p style="margin: 0; font-size: 15px; line-height: 1.5">[ברכה]</p>
        <strong style="font-size: 13px">[שם]</strong>
      </article>
    </div>
  </div>
</div>

}
